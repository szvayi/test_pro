name: Build Test Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref or SHA to build
        required: true
        default: master
      image_tag:
        description: Immutable SWR tag, for example test-20260929-1
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: test-image-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  IMAGE_NAMESPACE: vayi
  IMAGE_NAME: test-pro

jobs:
  build:
    name: Build and push test image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: test -n "$IMAGE_TAG" && [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=test-pro-image
          cache-to: type=gha,mode=max,scope=test-pro-image
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish image summary
        run: |
          {
            echo "## Test image"
            echo "- Repository: \`${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}\`"
            echo "- Tag: \`${{ inputs.image_tag }}\`"
            echo "- Source ref: \`${{ inputs.source_ref }}\`"
            echo "- Deployment: not run"
          } >> "$GITHUB_STEP_SUMMARY"
