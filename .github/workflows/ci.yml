name: Pull Request CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Compile backend
        run: uv run python -m compileall -q main.py

      - name: Start backend
        run: |
          uv run uvicorn main:app --host 127.0.0.1 --port 8010 > /tmp/test-pro-uvicorn.log 2>&1 &
          echo $! > /tmp/test-pro-uvicorn.pid

      - name: Check backend endpoints
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8010/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/healthz
          curl --fail --silent http://127.0.0.1:8010/api/health
          curl --fail --silent http://127.0.0.1:8010/api/routes

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/test-pro-uvicorn.log

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: web
        run: npm run build

  container:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          provenance: false
          tags: test-pro:ci-${{ github.sha }}
          cache-from: type=gha,scope=test-pro-ci
          cache-to: type=gha,mode=max,scope=test-pro-ci
