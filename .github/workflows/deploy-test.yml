name: Deploy Test Environment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable SWR tag from Build Test Image
        required: true
      project_name:
        description: Isolated Kestra/Kubernetes project name
        required: true
        default: test-pro-test
      host:
        description: Isolated test host with DNS/Ingress already configured
        required: true
        default: test-pro-test.app.vayi.cn

permissions:
  contents: read

concurrency:
  group: test-deploy-${{ inputs.project_name }}
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  IMAGE_NAMESPACE: vayi
  IMAGE_NAME: test-pro
  KESTRA_API_URL: https://kestra.vayi.cn

jobs:
  deploy:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test

    steps:
      - name: Validate deployment inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROJECT_NAME: ${{ inputs.project_name }}
          APP_HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAG" && [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$PROJECT_NAME" && [[ "$PROJECT_NAME" =~ ^[a-z0-9-]+$ ]]
          test -n "$APP_HOST" && [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]

      - name: Generate deployment payload
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROJECT_NAME: ${{ inputs.project_name }}
          APP_HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          jq -n \
            --arg projectName "$PROJECT_NAME" \
            --arg host "$APP_HOST" \
            --arg imageRepository "${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}" \
            --arg imageTag "$IMAGE_TAG" \
            '{
              projectName: $projectName,
              host: $host,
              services: [{
                name: "app",
                path: "/",
                image: { repository: $imageRepository, tag: $imageTag },
                expose: true,
                servicePort: 8000,
                containerPort: 8000
              }]
            }' > deploy-payload.json
          jq . deploy-payload.json

      - name: Trigger Kestra deployment
        id: trigger
        env:
          KESTRA_WEBHOOK_URL: ${{ secrets.KESTRA_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$KESTRA_WEBHOOK_URL"
          response=$(curl --fail-with-body --retry 2 --retry-delay 2 -sS \
            -X POST "$KESTRA_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @deploy-payload.json)
          execution_id=$(echo "$response" | jq -r '.id // .executionId // empty')
          test -n "$execution_id"
          echo "execution_id=$execution_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kestra deployment
        env:
          EXECUTION_ID: ${{ steps.trigger.outputs.execution_id }}
          KESTRA_USER: ${{ secrets.KESTRA_USER }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          APP_HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          test -n "$KESTRA_USER"
          test -n "$KESTRA_PASSWORD"
          execution_url="${KESTRA_API_URL%/}/api/v1/main/executions/$EXECUTION_ID"
          logs_url="${KESTRA_API_URL%/}/api/v1/main/logs/$EXECUTION_ID"
          for attempt in $(seq 1 120); do
            execution=$(curl --fail-with-body -sS -u "$KESTRA_USER:$KESTRA_PASSWORD" "$execution_url")
            state=$(echo "$execution" | jq -r '.state.current // empty')
            echo "Kestra state ($attempt/120): ${state:-UNKNOWN}"
            case "$state" in
              SUCCESS) break ;;
              FAILED|CANCELLED|KILLED|WARNING)
                curl --fail-with-body -sS -u "$KESTRA_USER:$KESTRA_PASSWORD" "$logs_url" | jq .
                exit 1
                ;;
            esac
            sleep 5
          done
          test "${state:-}" = SUCCESS

      - name: Smoke test isolated environment
        env:
          APP_HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "https://${APP_HOST}/healthz"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "https://${APP_HOST}/api/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "https://${APP_HOST}/api/routes"
          echo "Test deployment smoke checks passed: https://${APP_HOST}"
