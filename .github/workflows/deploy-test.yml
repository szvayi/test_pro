name: Deploy Test Environment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable SWR tag from Build Test Image
        required: true
      container_name:
        description: Docker container name on the test host
        required: true
        default: test-pro
      host_port:
        description: Host port mapped to container port 8000
        required: true
        default: "18000"
      smoke_url:
        description: URL checked from the test host, for example http://127.0.0.1:18000
        required: true
        default: http://127.0.0.1:18000

permissions:
  contents: read

concurrency:
  group: test-docker-${{ inputs.container_name }}
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  IMAGE_NAMESPACE: vayi
  IMAGE_NAME: test-pro

jobs:
  deploy:
    name: Deploy with Docker and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test

    steps:
      - name: Validate deployment inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          HOST_PORT: ${{ inputs.host_port }}
          SMOKE_URL: ${{ inputs.smoke_url }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAG" && [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$CONTAINER_NAME" && [[ "$CONTAINER_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          test "$HOST_PORT" -ge 1 && test "$HOST_PORT" -le 65535
          [[ "$SMOKE_URL" =~ ^https?://[A-Za-z0-9._:-]+$ ]]

      - name: Prepare SSH trust
        env:
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$TEST_SSH_KNOWN_HOSTS"
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/test-host-known_hosts"
          chmod 600 "$RUNNER_TEMP/test-host-known_hosts"

      - name: Login to SWR on test host
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ runner.temp }}/test-host-known_hosts
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TEST_SSH_HOST"
          test -n "$TEST_SSH_USER"
          test -n "$SWR_USERNAME"
          test -n "$SWR_PASSWORD"
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/test-host-key"
          chmod 600 "$RUNNER_TEMP/test-host-key"
          ssh_args=(-i "$RUNNER_TEMP/test-host-key" -o UserKnownHostsFile="$TEST_SSH_KNOWN_HOSTS" -o StrictHostKeyChecking=yes -p "${TEST_SSH_PORT:-22}")
          printf '%s' "$SWR_PASSWORD" | ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" \
            "docker login '$REGISTRY' --username '$SWR_USERNAME' --password-stdin"

      - name: Pull and replace test container
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          HOST_PORT: ${{ inputs.host_port }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/test-host-key" -o UserKnownHostsFile="$RUNNER_TEMP/test-host-known_hosts" -o StrictHostKeyChecking=yes -p "${TEST_SSH_PORT:-22}")
          image="$REGISTRY/$IMAGE_NAMESPACE/$IMAGE_NAME:$IMAGE_TAG"
          ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" \
            "set -eu; docker pull '$image'; docker rm -f '$CONTAINER_NAME' >/dev/null 2>&1 || true; docker run -d --name '$CONTAINER_NAME' --restart unless-stopped -p '$HOST_PORT:8000' '$image'"

      - name: Smoke test from test host
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          SMOKE_URL: ${{ inputs.smoke_url }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/test-host-key" -o UserKnownHostsFile="$RUNNER_TEMP/test-host-known_hosts" -o StrictHostKeyChecking=yes -p "${TEST_SSH_PORT:-22}")
          for attempt in $(seq 1 12); do
            if ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" "curl --fail --silent --show-error '$SMOKE_URL/healthz'"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" "docker logs '$CONTAINER_NAME'" || true
              exit 1
            fi
            sleep 5
          done
          ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" "curl --fail --silent --show-error '$SMOKE_URL/api/health'"
          ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" "curl --fail --silent --show-error '$SMOKE_URL/api/routes'"

      - name: Logout from SWR on test host
        if: always()
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/test-host-key" -o UserKnownHostsFile="$RUNNER_TEMP/test-host-known_hosts" -o StrictHostKeyChecking=yes -p "${TEST_SSH_PORT:-22}")
          ssh "${ssh_args[@]}" "$TEST_SSH_USER@$TEST_SSH_HOST" "docker logout '$REGISTRY'" || true
