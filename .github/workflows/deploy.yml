name: Build and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  IMAGE_NAMESPACE: vayi
  DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}

jobs:
  prepare:
    name: Validate deployment definition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      image_tag: ${{ steps.config.outputs.image_tag }}
      host: ${{ steps.config.outputs.host }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deploy.json schema
        run: |
          set -euo pipefail
          npx --yes ajv-cli@5 validate \
            -s .deploy/deploy.schema.json \
            -d .deploy/deploy.json \
            --spec=draft2020

      - name: Validate service definitions and prepare outputs
        id: config
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        shell: bash
        run: |
          set -euo pipefail

          total=$(jq '.services | length' .deploy/deploy.json)
          unique=$(jq '[.services[].name] | unique | length' .deploy/deploy.json)
          test "$total" -eq "$unique"

          while IFS= read -r service; do
            context=$(jq -r '.context' <<< "$service")
            dockerfile=$(jq -r '.dockerfile' <<< "$service")
            test -d "$context"
            test -f "$dockerfile"
          done < <(jq -c '.services[]' .deploy/deploy.json)

          while IFS= read -r job; do
            job_image=$(jq -r '.image' <<< "$job")
            if jq -e --arg image "$job_image" \
              'any(.services[]; .image == $image)' \
              .deploy/deploy.json >/dev/null; then
              continue
            fi
            context=$(jq -r '.context // empty' <<< "$job")
            dockerfile=$(jq -r '.dockerfile // empty' <<< "$job")
            test -n "$context"
            test -n "$dockerfile"
            test -d "$context"
            test -f "$dockerfile"
          done < <(jq -c '(.jobs // [])[]' .deploy/deploy.json)

          matrix=$(jq -c '
            . as $root
            | ([.services[] | {name, context, dockerfile, image}]
              + [(.jobs // [])[]
                | select((.image as $image | any($root.services[]; .image == $image)) | not)
                | {name, context, dockerfile, image}])
            | unique_by(.image)
            | {include: .}
          ' .deploy/deploy.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "host=$(jq -r '.host' .deploy/deploy.json)" >> "$GITHUB_OUTPUT"

          if [ -n "$RELEASE_TAG" ]; then
            image_tag="$RELEASE_TAG"
          else
            image_tag="sha-${GITHUB_SHA::7}"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image tag: $image_tag"
            exit 1
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: false
          load: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Push image to SWR
        timeout-minutes: 10
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
        run: docker push "$IMAGE_REF"

  deploy:
    name: Deploy to Kubernetes
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate deployment payload
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          jq \
            --arg registry "$REGISTRY" \
            --arg namespace "$IMAGE_NAMESPACE" \
            --arg tag "$IMAGE_TAG" \
            '{
              operation: "deploy",
              projectName: .projectName,
              host: .host,
              environment: "production",
              commitSha: $tag,
              jobs: [
                  (.jobs // [])[] as $job
                  | ($job | del(.context, .dockerfile, .image)
                  | .image = {
                      repository: ($registry + "/" + $namespace + "/" + $job.image),
                      tag: $tag
                    })
              ],
              services: [
                .services[] as $service
                | ($service | del(.context, .dockerfile, .image)
                  | .image = {
                      repository: ($registry + "/" + $namespace + "/" + $service.image),
                      tag: $tag
                    })
              ]
            }' .deploy/deploy.json > deploy-payload.json

          jq -e '
            (.projectName | type == "string") and
            (.host | type == "string") and
            (.services | length >= 1) and
            (.jobs | type == "array") and
            all(.services[];
              (.name | type == "string") and
              (.image.repository | type == "string") and
              (.image.tag | type == "string") and
              (.containerPort | type == "number") and
              (.servicePort | type == "number") and
              (.expose | type == "boolean")
            ) and
            all(.jobs[];
              (.name | type == "string") and
              (.image.repository | type == "string") and
              (.image.tag | type == "string")
            )
          ' deploy-payload.json >/dev/null

          jq . deploy-payload.json

      - name: Deploy through vayi-app API
        env:
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_API_URL"
          test -n "$DEPLOY_API_KEY"

          response=$(curl --fail-with-body -sS \
            -X POST "${DEPLOY_API_URL%/}/api/v1/deploy/release" \
            -H "X-API-Key: $DEPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @deploy-payload.json)
          echo "$response" | jq .

      - name: Verify deployed application
        env:
          APP_HOST: ${{ needs.prepare.outputs.host }}
        shell: bash
        run: |
          set -euo pipefail
          app_url="https://${APP_HOST}"

          for attempt in $(seq 1 12); do
            health_ok=0
            for health_path in /health /api/health; do
              if curl --fail --silent --show-error "$app_url$health_path" >/dev/null; then
                health_ok=1
                break
              fi
            done
            if [ "$health_ok" -eq 1 ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Application must expose /health or /api/health" >&2
              exit 1
            fi
            sleep 5
          done
