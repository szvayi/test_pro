name: Build and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  IMAGE_NAMESPACE: vayi
  KESTRA_API_URL: https://kestra.vayi.cn

jobs:
  prepare:
    name: Validate deployment definition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      image_tag: ${{ steps.config.outputs.image_tag }}
      host: ${{ steps.config.outputs.host }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deploy.json schema
        run: |
          set -euo pipefail
          npx --yes ajv-cli@5 validate \
            -s .deploy/deploy.schema.json \
            -d .deploy/deploy.json \
            --spec=draft2020

      - name: Validate service definitions and prepare outputs
        id: config
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        shell: bash
        run: |
          set -euo pipefail

          total=$(jq '.services | length' .deploy/deploy.json)
          unique=$(jq '[.services[].name] | unique | length' .deploy/deploy.json)
          test "$total" -eq "$unique"

          while IFS= read -r service; do
            context=$(jq -r '.context' <<< "$service")
            dockerfile=$(jq -r '.dockerfile' <<< "$service")
            test -d "$context"
            test -f "$dockerfile"
          done < <(jq -c '.services[]' .deploy/deploy.json)

          matrix=$(jq -c '{include: .services}' .deploy/deploy.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "host=$(jq -r '.host' .deploy/deploy.json)" >> "$GITHUB_OUTPUT"

          if [ -n "$RELEASE_TAG" ]; then
            image_tag="$RELEASE_TAG"
          else
            image_tag="sha-${GITHUB_SHA::7}"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image tag: $image_tag"
            exit 1
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate Kestra payload
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          jq \
            --arg registry "$REGISTRY" \
            --arg namespace "$IMAGE_NAMESPACE" \
            --arg tag "$IMAGE_TAG" \
            '{
              projectName: .projectName,
              host: .host,
              services: [
                .services[] as $service
                | ($service | del(.context, .dockerfile, .image)
                  | .image = {
                      repository: ($registry + "/" + $namespace + "/" + $service.image),
                      tag: $tag
                    })
              ]
            }' .deploy/deploy.json > deploy-payload.json

          jq . deploy-payload.json

      - name: Trigger Kestra deployment
        id: trigger
        env:
          KESTRA_WEBHOOK_URL: ${{ secrets.KESTRA_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body -sS \
            -X POST "$KESTRA_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @deploy-payload.json)

          execution_id=$(echo "$response" | jq -r '.id // .executionId')
          test -n "$execution_id"
          test "$execution_id" != "null"
          echo "execution_id=$execution_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kestra deployment
        env:
          EXECUTION_ID: ${{ steps.trigger.outputs.execution_id }}
          KESTRA_USER: ${{ secrets.KESTRA_USER }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            execution=$(curl --fail-with-body -sS \
              --user "$KESTRA_USER:$KESTRA_PASSWORD" \
              "$KESTRA_API_URL/api/v1/main/executions/$EXECUTION_ID")
            state=$(echo "$execution" | jq -r '.state.current // empty')
            echo "Kestra state ($attempt/120): ${state:-UNKNOWN}"

            case "$state" in
              SUCCESS)
                exit 0
                ;;
              FAILED|CANCELLED|KILLED|WARNING)
                curl --fail-with-body -sS \
                  --user "$KESTRA_USER:$KESTRA_PASSWORD" \
                  "$KESTRA_API_URL/api/v1/main/logs/$EXECUTION_ID" | jq .
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for Kestra execution: $EXECUTION_ID"
          exit 1

      - name: Verify deployed application
        env:
          APP_HOST: ${{ needs.prepare.outputs.host }}
        shell: bash
        run: |
          set -euo pipefail
          app_url="https://${APP_HOST}"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$app_url/healthz" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error "$app_url/" >/dev/null
          curl --fail --silent --show-error "$app_url/api/health"
          curl --fail --silent --show-error "$app_url/api/routes"
